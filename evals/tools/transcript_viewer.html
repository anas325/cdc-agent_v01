<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcript viewer — benchmark CDC</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #e6e8ee; --dim: #99a0b0; --accent: #6ea8fe;
    --ok: #57c98a; --skip: #7d8592; --warn: #e0b060;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --panel2: #f0f2f6; --line: #dfe3ea;
      --fg: #1b1f27; --dim: #626b7c; --accent: #2b6cb0;
      --ok: #1f9254; --skip: #8a919e; --warn: #a06a10;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 12px 20px;
  }
  h1 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; }
  .stat {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 9px; font-size: 12px; color: var(--dim);
  }
  .stat b { color: var(--fg); font-variant-numeric: tabular-nums; }
  input[type=search], label.file {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px;
  }
  label.file, button { cursor: pointer; }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px;
  }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  input[type=file] { display: none; }
  main { padding: 18px 20px 60px; max-width: 1100px; margin: 0 auto; }
  .drop {
    border: 1px dashed var(--line); border-radius: 10px; padding: 48px 20px;
    text-align: center; color: var(--dim);
  }
  body.dragging .drop { border-color: var(--accent); color: var(--accent); }
  .round { margin-bottom: 22px; }
  .round > h2 {
    font-size: 13px; font-weight: 600; color: var(--dim); margin: 0 0 8px;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .qa {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--skip);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
  }
  .qa.matched { border-left-color: var(--ok); }
  .q { margin: 0 0 8px; }
  .a { margin: 0; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--fg); }
  .a.skipped { color: var(--dim); font-style: italic; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .tag {
    font: 11px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    padding: 0 6px; border-radius: 4px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--dim);
  }
  .tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 2px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Transcript viewer <small id="src">aucun fichier chargé</small></h1>
  <div class="bar">
    <label class="file">Charger transcript.jsonl<input type="file" id="file" accept=".jsonl,.json,.txt"></label>
    <button id="only" aria-pressed="false">Réponses utiles seulement</button>
    <input type="search" id="q" placeholder="Filtrer (question, réponse, gap id…)">
    <div class="stats" id="stats"></div>
  </div>
</header>
<main>
  <div class="drop" id="drop">Glissez un <code>transcript.jsonl</code> ici, ou utilisez le bouton ci-dessus.</div>
  <div id="rounds"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
let ROWS = [];
let ONLY = false;

function parse(text) {
  return text.split(/\r?\n/).filter((l) => l.trim()).map((l, i) => {
    try { return JSON.parse(l); }
    catch (e) { return { round: i, turn: null, _error: e.message, questions: [], answers: [] }; }
  });
}

function pairs(row) {
  const byId = new Map((row.answers || []).map((a) => [a.gap_id, a]));
  const seen = new Set();
  const out = (row.questions || []).map((q) => {
    seen.add(q.gap_id);
    return { q, a: byId.get(q.gap_id) || null };
  });
  // réponses orphelines (pas de question correspondante)
  for (const a of row.answers || []) if (!seen.has(a.gap_id)) out.push({ q: null, a });
  return out;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function hl(s, needle) {
  const t = esc(s);
  if (!needle) return t;
  const re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
  return t.replace(re, (m) => `<mark>${m}</mark>`);
}

function render() {
  const needle = $("#q").value.trim();
  const low = needle.toLowerCase();
  let nQ = 0, nAns = 0, nSkip = 0, conf = [];
  const refs = new Set();
  const html = [];

  for (const row of ROWS) {
    const cards = [];
    for (const { q, a } of pairs(row)) {
      const matched = a && !a.skip && (a.text || "").trim();
      nQ++;
      if (matched) { nAns++; if (a.confidence != null) conf.push(a.confidence); if (a.matched_gap_ref) refs.add(a.matched_gap_ref); }
      else nSkip++;
      if (ONLY && !matched) continue;
      const blob = [q?.text, a?.text, q?.gap_id || a?.gap_id, a?.matched_gap_ref, a?.reason].join(" ").toLowerCase();
      if (low && !blob.includes(low)) continue;

      const tags = [`<span class="tag">${esc(q?.gap_id || a?.gap_id || "?")}</span>`];
      if (a?.reason) tags.push(`<span class="tag ${matched ? "ok" : ""}">${esc(a.reason)}</span>`);
      if (a?.matched_gap_ref) tags.push(`<span class="tag ok">${esc(a.matched_gap_ref)}</span>`);
      if (a?.confidence != null) {
        const c = a.confidence;
        tags.push(`<span class="tag ${c >= 0.75 ? "ok" : "warn"}">conf ${c}</span>`);
      }
      cards.push(`<div class="qa ${matched ? "matched" : ""}">
        <div class="meta">${tags.join("")}</div>
        <p class="q">${q ? hl(q.text, needle) : "<em>(question absente)</em>"}</p>
        <p class="a ${matched ? "" : "skipped"}">${
          matched ? hl(a.text, needle) : "— pas de réponse (" + esc(a?.reason || "n/a") + ")"
        }</p>
      </div>`);
    }
    if (!cards.length) continue;
    html.push(`<section class="round">
      <h2>Round ${esc(row.round)} · turn ${esc(row.turn)} · ${cards.length} question(s)</h2>
      ${cards.join("")}
    </section>`);
  }

  $("#rounds").innerHTML = html.join("") || `<div class="drop">Aucun résultat.</div>`;
  const avg = conf.length ? (conf.reduce((s, x) => s + x, 0) / conf.length).toFixed(2) : "—";
  $("#stats").innerHTML = [
    ["rounds", ROWS.length],
    ["questions", nQ],
    ["répondues", `${nAns} (${nQ ? Math.round((100 * nAns) / nQ) : 0}%)`],
    ["ignorées", nSkip],
    ["gaps GT", refs.size],
    ["conf. moy.", avg],
  ].map(([k, v]) => `<span class="stat">${k} <b>${v}</b></span>`).join("");
}

function load(text, name) {
  ROWS = parse(text);
  $("#src").textContent = name;
  $("#drop").classList.add("hidden");
  render();
}

$("#file").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (f) f.text().then((t) => load(t, f.name));
});
$("#q").addEventListener("input", render);
$("#only").addEventListener("click", (e) => {
  ONLY = !ONLY;
  e.currentTarget.setAttribute("aria-pressed", String(ONLY));
  render();
});
for (const ev of ["dragenter", "dragover"]) {
  document.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
}
for (const ev of ["dragleave", "drop"]) {
  document.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.remove("dragging"); });
}
document.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f) f.text().then((t) => load(t, f.name));
});
// ?file=... fonctionne uniquement si la page est servie en http (pas en file://)
const qs = new URLSearchParams(location.search).get("file");
if (qs) fetch(qs).then((r) => r.text()).then((t) => load(t, qs)).catch(() => {});
</script>
</body>
</html>
