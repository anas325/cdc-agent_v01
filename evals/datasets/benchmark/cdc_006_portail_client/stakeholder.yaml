# Synthetic stakeholder for cdc_006_portail_client.
#
# Sales-side owner: knows the commercial rules, defers every security question
# to the RSSI policy in source_docs/. The `unknown` list is what makes this case
# a real test of retrieval rather than of the simulator's imagination.

name: "Directrice commerciale réseau distributeurs"
role: "Business Owner"

knowledge:
  - "Un distributeur est bloqué dès qu'une facture dépasse 30 jours de retard, décision de la comptabilité."
  - "Le blocage empêche toute nouvelle commande mais laisse passer celles déjà transmises à l'ERP."
  - "Un distributeur bloqué garde l'accès à ses documents et à son historique."
  - "Le tarif appliqué est celui du contrat du distributeur, remonté par l'ERP."
  - "Le minimum de commande est de 500 € HT."
  - "Un produit indisponible reste commandable, avec une date de disponibilité affichée."
  - "Aucune validation interne n'est requise en dessous de 20 000 € HT."
  - "L'ERP est la source de vérité : le portail lit le catalogue, les encours et les documents, et lui pousse les commandes."
  - "Si l'ERP est indisponible, la commande est mise en file et retransmise automatiquement."
  - "Une commande rejetée par l'ERP repasse en brouillon avec le motif, et l'administration des ventes est notifiée."
  - "Le projet est accepté si 80 % des commandes des pilotes passent par le portail sans ressaisie sur un mois complet."
  - "Les 40 pilotes sont les plus gros volumes ; les autres sont ouverts par vagues de 80 tous les deux mois."

unknown:
  - "Le mode d'authentification imposé aux partenaires externes"
  - "Les rôles et le modèle d'habilitation standard"
  - "Les exigences de journalisation et de conservation"
  - "Les cibles de charge, de disponibilité et de temps de réponse"

behavior:
  style: precise
  unknown_rate: 0.0
  allow_contradictions: false

contradictions:
  - "Le blocage pour impayé coupe aussi l'accès aux factures et aux bons de livraison."
  - "Finalement chaque distributeur peut créer autant de comptes utilisateurs qu'il veut, sans administrateur."
