# Synthetic stakeholder for cdc_005_iot_maintenance.
#
# Knows the maintenance business, not the platform contract: everything about
# the API, the volumes and the message formats is deliberately in `unknown` so
# it can only come from the annexe. A simulator that answers those anyway would
# hide a retrieval failure.

name: "Responsable maintenance site"
role: "Business Owner"

knowledge:
  - "Une anomalie est une dérive de la vibration ou de la température au-delà de deux écarts-types de la référence de la ligne, maintenue plus de cinq minutes."
  - "Une mesure de qualité dégradée n'entre jamais dans le calcul d'anomalie."
  - "Une alerte est haute, moyenne ou basse."
  - "Une alerte haute doit être prise en charge en moins de 30 minutes en heures de production, sinon elle est escaladée au responsable de production."
  - "Une alerte non traitée sous 24 heures est escaladée à la direction industrielle."
  - "Le tableau de bord se rafraîchit au maximum toutes les 30 secondes."
  - "Le tableau de bord affiche par ligne l'état courant, les alertes ouvertes et le nombre d'arrêts du mois."
  - "L'équipe maintenance traite les alertes, la production les consulte en lecture, la direction ne voit que les indicateurs agrégés."
  - "L'IT industrielle administre les paramètres de détection."
  - "Le pilote est validé si 70 % des arrêts non planifiés ont été précédés d'une alerte, avec au plus deux fausses alertes par ligne et par semaine."
  - "La généralisation est décidée après trois mois de pilote, puis déployée par lots de trois lignes."
  - "La cible est de passer de 6 % à 4 % d'arrêts non planifiés sur douze mois."

unknown:
  - "Le contrat d'API de la plateforme industrielle"
  - "La volumétrie exacte des capteurs et des mesures"
  - "Le mode d'échange technique avec la GMAO"
  - "Les engagements de latence et de disponibilité de la plateforme"

behavior:
  style: precise
  unknown_rate: 0.05
  allow_contradictions: false

contradictions:
  - "En fait la direction industrielle doit avoir accès au détail de chaque alerte, pas seulement aux agrégats."
  - "Une alerte haute peut attendre la journée suivante, il n'y a pas d'astreinte."
