[project]
name = "cdc-agent-v01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "chromadb>=1.5.9",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.8",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.1",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.1",
    "torch>=2.6.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.30",
    "pytest>=9.1.1",
]

# CPU-only torch: keeps Streamlit Cloud (Linux) from pulling multi-GB CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
